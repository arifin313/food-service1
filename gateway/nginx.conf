# API gateway: serves the website and routes /api/<service>/* to the matching microservice.
# Variables + resolver make nginx start even if a service is down (that route returns 502 only).
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 "ok\n"; }

    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location /api/temperature/ {
        set $upstream http://temperature-service:5001;
        rewrite ^/api/temperature/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/food/ {
        set $upstream http://food-service:5002;
        rewrite ^/api/food/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/alerts/ {
        set $upstream http://alert-service:5003;
        rewrite ^/api/alerts/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/reports/ {
        set $upstream http://report-service:5004;
        rewrite ^/api/reports/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
}
